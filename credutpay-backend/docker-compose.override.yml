version: "3.8"
services:
  db:
    image: postgres:latest
    container_name: Credutpay
    restart: always
    environment:
      - POSTGRES_DB=Credutpay
      - POSTGRES_USER=credutpay_user
      - POSTGRES_PASSWORD=credutpay_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
