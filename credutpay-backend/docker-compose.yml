version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: Credutpay
    restart: always
    environment:
      - POSTGRES_DB=Credutpay
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
